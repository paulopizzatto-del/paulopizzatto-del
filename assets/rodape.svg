<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 300" width="1760" height="300" role="img">
<title>Paulo Pizzatto — Retro Arcade</title>
<defs>
 <pattern id="scan" patternUnits="userSpaceOnUse" width="4" height="5"><rect width="4" height="1" fill="#000" opacity=".18"/></pattern>
 <filter id="glow" x="-30%" y="-40%" width="160%" height="190%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <linearGradient id="vgrad" x2="0" y2="1"><stop offset="0" stop-color="#010301"/><stop offset="1" stop-color="#081008"/></linearGradient>
</defs>
<rect x="0" y="0" width="1760" height="300" fill="url(#vgrad)" />

 <text x="880" y="127" fill="#39ff14" font-family="Courier New,monospace" font-weight="900" font-size="63" letter-spacing="3" text-anchor="middle" filter="url(#glow)">OBRIGADO POR JOGAR!</text>
 <text x="880" y="211" fill="#166e0c" font-family="Courier New,monospace" font-weight="900" font-size="41" letter-spacing="3" text-anchor="middle">CONTINUE? 9</text>
 <g><text x="880" y="266" fill="#39ff14" font-family="Courier New,monospace" font-weight="900" font-size="30" letter-spacing="3" text-anchor="middle">INSERT COIN</text>
 <animate attributeName="opacity" values="0;0;1;1;0" dur="3s" repeatCount="indefinite"/></g>
<rect x="0" y="0" width="1760" height="300" fill="url(#scan)" pointer-events="none"/>
</svg>